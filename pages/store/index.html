<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M16 7v13m-5-5 5 5 5-5M8 25h16' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
  <title>L&C APK 下载</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e6eaf2;
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --brand-soft: #eef4ff;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(1000px 320px at 50% -12%, #dbeafe 0%, rgba(219, 234, 254, 0) 62%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 顶部栏 ===== */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255, 255, 255, .85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: 1180px; margin: 0 auto;
      padding: 12px 20px;
      display: flex; align-items: center; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 11px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff; flex: none;
      box-shadow: 0 6px 14px rgba(37, 99, 235, .3);
    }
    .brand h1 { margin: 0; font-size: 16px; }
    .brand p { margin: 1px 0 0; font-size: 11px; color: var(--muted); }

    .search {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
      width: min(300px, 44vw); height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      background: #f1f4f9;
      border: 1px solid transparent;
      transition: background .15s, border-color .15s, box-shadow .15s;
    }
    .search:focus-within { background: #fff; border-color: #bfdbfe; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
    .search svg { color: var(--muted); flex: none; }
    .search input { width: 100%; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; }

    /* ===== 主体 ===== */
    .page { max-width: 1180px; margin: 0 auto; padding: 16px 20px 40px; }

    .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      font: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: all .15s;
    }
    .tab .count { font-size: 11px; color: var(--muted); background: #f1f5f9; border-radius: 999px; padding: 1px 7px; }
    .tab.active { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 8px 16px rgba(37, 99, 235, .25); }
    .tab.active .count { background: rgba(255, 255, 255, .22); color: #fff; }

    .crumb {
      display: flex; align-items: center; gap: 8px;
      min-height: 18px; margin: 10px 2px 0;
      font-size: 12px; color: var(--muted);
    }
    .crumb button {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--line); background: var(--panel); color: var(--text);
      border-radius: 8px; padding: 4px 9px;
      font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .crumb button:hover { border-color: #c7d7fe; color: var(--brand); }
    .crumb .current { color: var(--text); font-weight: 600; }

    .summary {
      display: flex; align-items: center; justify-content: space-between;
      margin: 12px 2px 8px;
      font-size: 12px; color: var(--muted);
    }
    .summary strong { color: var(--text); font-size: 14px; }

    /* ===== 列表 ===== */
    .list {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid #f1f4f9;
      cursor: pointer;
      transition: background .12s;
      text-align: left;
      width: 100%;
      background: transparent;
      border-left: 0; border-right: 0; border-top: 0;
      font: inherit; color: inherit;
    }
    .row:last-child { border-bottom: 0; }
    .row:hover { background: #f8faff; }
    .row:active { background: #eef4ff; }

    .thumb {
      width: 44px; height: 44px; flex: none;
      border-radius: 12px;
      display: grid; place-items: center;
      overflow: hidden;
      background: #f1f5f9;
      color: #fff;
      font-size: 18px; font-weight: 700;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb.app img { object-fit: contain; background: #fff; padding: 3px; }
    .thumb.folder { background: linear-gradient(135deg, #fbbf24, #f59e0b); font-size: 20px; }
    .thumb.plain { background: #f1f5f9; color: #64748b; font-size: 18px; }
    .thumb.photo { background: #e2e8f0; }

    .main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .name {
      font-size: 14px; font-weight: 600; line-height: 1.35;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
    .tag {
      display: inline-flex; align-items: center;
      padding: 1px 7px; border-radius: 999px;
      background: var(--brand-soft); color: var(--brand-dark);
      font-weight: 600; font-size: 10.5px; letter-spacing: .02em;
    }
    .tag.folder { background: #fff7e6; color: #b45309; }
    .tag.photo { background: #ecfdf5; color: #047857; }
    .tag.other { background: #f1f5f9; color: #475569; }

    .row-date { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

    .action {
      flex: none;
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 12px;
      border-radius: 9px;
      border: 1px solid transparent;
      font: inherit; font-size: 12.5px; font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
    }
    .action.primary { background: var(--brand); color: #fff; }
    .action.primary:hover { background: var(--brand-dark); }
    .action.ghost { background: #f1f5f9; color: var(--text); border-color: var(--line); }
    .action.ghost:hover { background: #e8eefb; border-color: #d7e3ff; }
    .action:disabled { opacity: .6; cursor: wait; }

    .spinner {
      width: 13px; height: 13px;
      border: 2px solid rgba(255, 255, 255, .45);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== 骨架 / 空 / 错误 ===== */
    .skeleton-row { height: 64px; border-bottom: 1px solid #f1f4f9; background: linear-gradient(100deg, #f6f8fc 30%, #eef2f9 50%, #f6f8fc 70%); background-size: 200% 100%; animation: shimmer 1.3s infinite linear; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .state { padding: 56px 20px; text-align: center; color: var(--muted); }
    .state .emoji { font-size: 36px; }
    .state h3 { margin: 8px 0 4px; font-size: 15px; color: var(--text); }
    .state p { margin: 0 0 12px; font-size: 13px; }
    .state .action { display: inline-flex; }

    /* ===== 分页 ===== */
    .pager { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 18px 0 0; min-height: 36px; }
    .pager button {
      height: 36px; padding: 0 14px;
      border: 1px solid var(--line); background: var(--panel); color: var(--text);
      border-radius: 9px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .pager button:hover:not(:disabled) { border-color: #c7d7fe; color: var(--brand); }
    .pager button:disabled { opacity: .45; cursor: default; }
    .pager .info { font-size: 12px; color: var(--muted); padding: 0 6px; }

    /* ===== 图片预览 ===== */
    .viewer {
      position: fixed; inset: 0; z-index: 70;
      display: none; place-items: center;
      background: rgba(8, 12, 24, .88);
      backdrop-filter: blur(6px);
      padding: 24px;
    }
    .viewer.open { display: grid; }
    .viewer img {
      max-width: min(96vw, 1400px);
      max-height: 84vh;
      border-radius: 10px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, .5);
      background: #111;
    }
    .viewer-bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(0, 0, 0, .65));
      color: #fff; font-size: 13px;
    }
    .viewer-bar .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .viewer-close {
      position: fixed; top: 16px; right: 16px;
      width: 40px; height: 40px;
      border: 0; border-radius: 12px;
      background: rgba(255, 255, 255, .14);
      color: #fff; font-size: 20px; cursor: pointer;
    }
    .viewer-close:hover { background: rgba(255, 255, 255, .24); }
    .viewer .action { height: 36px; }

    /* ===== 轻提示 ===== */
    .toast {
      position: fixed; left: 50%; bottom: 24px; z-index: 90;
      transform: translate(-50%, 14px); opacity: 0;
      padding: 10px 16px; border-radius: 10px;
      background: rgba(15, 23, 42, .92); color: #fff; font-size: 13px;
      pointer-events: none; transition: opacity .2s, transform .2s;
      max-width: min(90vw, 460px);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ===== 登录门禁 ===== */
    .auth-shell {
      position: fixed; inset: 0; z-index: 50;
      display: grid; place-items: center;
      background: rgba(244, 246, 251, .96);
      padding: 20px;
    }
    .auth-card {
      width: min(360px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, .12);
      padding: 28px 24px;
      text-align: center;
    }
    .auth-icon { font-size: 40px; margin-bottom: 6px; }
    .auth-card h2 { margin: 0 0 6px; font-size: 19px; }
    .auth-desc { margin: 0 0 18px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
    .auth-input {
      width: 100%; height: 42px;
      border: 1px solid var(--line); border-radius: 11px;
      padding: 0 12px;
      font: inherit; font-size: 14px;
      text-align: center;
      background: #f8fafc;
    }
    .auth-input:focus { outline: 2px solid #bfdbfe; border-color: #93c5fd; background: #fff; }
    .auth-error { min-height: 18px; margin: 8px 0 4px; font-size: 12px; color: var(--danger); }
    .auth-btn {
      width: 100%; height: 42px;
      border: 0; border-radius: 11px;
      background: var(--brand); color: #fff;
      font: inherit; font-size: 14px; font-weight: 650;
      cursor: pointer;
    }
    .auth-btn:hover { background: var(--brand-dark); }
    .auth-btn:disabled { opacity: .6; cursor: wait; }

    /* ===== GitHub 发布 ===== */
    .gh { display: none; }
    .gh.open { display: block; }
    .gh-config {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
      background: #fff; border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 14px; margin-bottom: 12px;
    }
    .gh-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
    .gh-field input, .gh-field select {
      height: 34px; min-width: 190px;
      border: 1px solid var(--line); border-radius: 9px; padding: 0 10px;
      font: inherit; font-size: 13px; color: var(--text);
      background: #fff;
    }
    .gh-field input:focus, .gh-field select:focus { outline: 2px solid #bfdbfe; border-color: #93c5fd; }
    .gh-check {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--muted);
      height: 34px;
    }
    .gh-check input { width: 16px; height: 16px; }
    .gh-save {
      height: 34px; padding: 0 14px;
      border: 0; border-radius: 9px;
      background: var(--brand); color: #fff;
      font: inherit; font-size: 13px; font-weight: 650;
      cursor: pointer;
    }
    .gh-save:hover { background: var(--brand-dark); }
    .gh-status { font-size: 12px; color: var(--muted); margin: 2px 2px 10px; }
    .gh-repo {
      background: #fff; border: 1px solid var(--line); border-radius: 14px;
      margin-bottom: 12px; overflow: hidden;
    }
    .gh-repo-head {
      display: flex; gap: 10px; align-items: baseline;
      padding: 12px 14px; border-bottom: 1px solid #f1f4f9;
    }
    .gh-repo-head a { color: var(--brand); font-weight: 700; font-size: 14px; text-decoration: none; }
    .gh-repo-head a:hover { text-decoration: underline; }
    .gh-repo-head span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gh-release { padding: 10px 14px; border-bottom: 1px solid #f1f4f9; }
    .gh-release:last-child { border-bottom: 0; }
    .gh-tag { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .gh-tag b { color: var(--text); font-size: 13px; }
    .gh-asset { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
    .gh-asset .gh-name { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gh-asset .gh-size { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .gh-asset .action { height: 32px; }

    /* ===== 平板 / 触屏 / 手机 ===== */
    @media (min-width: 769px) and (max-width: 1180px) {
      .page { padding: 14px 18px 36px; }
      .row { padding: 11px 14px; }
      .action { height: 36px; }
    }
    @media (pointer: coarse) {
      .row { padding: 12px 14px; }
      .action { height: 38px; min-width: 64px; }
      .row:hover { background: transparent; }
      .row:active { background: #eef4ff; }
    }
    @media (max-width: 640px) {
      .topbar-inner { flex-wrap: wrap; gap: 10px; padding: 10px 14px; }
      .search { margin-left: 0; width: 100%; }
      .page { padding: 12px 14px 32px; }
      .row-date { display: none; }
      .name { font-size: 13px; }
      .action { padding: 0 10px; font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M4 21h16" />
        </svg>
      </span>
      <div>
        <h1>APK 下载</h1>
        <p>平板应用 · 图片预览</p>
      </div>
    </div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7" /><path d="m20 20-3.2-3.2" />
      </svg>
      <input id="searchInput" type="search" placeholder="搜索名称…" autocomplete="off" aria-label="搜索" />
    </label>
  </div>
</header>

<!-- 登录门禁：会话滑动续期，一年内打开过一次就不用再登录 -->
<section class="auth-shell" id="authShell" hidden>
  <div class="auth-card">
    <div class="auth-icon">📦</div>
    <h2>登录应用下载</h2>
    <p class="auth-desc">输入访问密钥登录。登录后长期有效，无需反复输入。</p>
    <form id="authForm">
      <input class="auth-input" id="authKey" type="password" autocomplete="current-password"
             placeholder="访问密钥" required />
      <div class="auth-error" id="authError" role="alert"></div>
      <button class="auth-btn" id="authSubmit" type="submit">登录</button>
    </form>
  </div>
</section>

<main class="page" id="appPage" hidden>
  <nav class="tabs" id="tabs" aria-label="分类"></nav>
  <div class="crumb" id="crumb"></div>
  <div class="summary" id="summary"></div>
  <section class="list" id="list" aria-live="polite"></section>
  <nav class="pager" id="pager" aria-label="分页"></nav>

  <section class="gh" id="ghPanel" aria-label="GitHub 发布">
    <div class="gh-config">
      <label class="gh-field">GitHub 账号
        <input id="ghUser" type="text" spellcheck="false" autocomplete="off" placeholder="例如 shovelshit" />
      </label>
      <label class="gh-field">下载线路
        <select id="ghProxyMode">
          <option value="auto">自动探测（推荐）</option>
          <option value="https://gh-proxy.com/">gh-proxy.com</option>
          <option value="https://ghfast.top/">ghfast.top</option>
          <option value="https://ghproxy.net/">ghproxy.net</option>
          <option value="direct">直连 GitHub</option>
          <option value="custom">自定义…</option>
        </select>
      </label>
      <label class="gh-field" id="ghCustomWrap" hidden>自定义前缀
        <input id="ghProxyCustom" type="text" spellcheck="false" autocomplete="off" placeholder="https://你的加速站/" />
      </label>
      <button class="gh-save" id="ghSave" type="button">保存并刷新</button>
    </div>
    <div class="gh-status" id="ghProxyHint"></div>
    <div class="gh-status" id="ghStatus"></div>
    <div id="ghList"></div>
  </section>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="图片预览">
  <button class="viewer-close" type="button" data-close-viewer aria-label="关闭">×</button>
  <img id="viewerImg" alt="" />
  <div class="viewer-bar">
    <span class="title" id="viewerTitle"></span>
    <button class="action primary" type="button" id="viewerDownload">下载原图</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
  const API_BASE = '/store/api';
  const PAGE_SIZE = 40;
  const FOLDER_FETCH_SIZE = 300;

  const CATEGORIES = [
    { path: '/CarMax/地图导航', name: '地图导航', icon: '🗺️' },
    { path: '/CarMax/实用工具', name: '实用工具', icon: '🔧' },
  ];

  const IMAGE_EXT = /\.(jpe?g|png|gif|webp|bmp|svg)$/i;

  // 所有 APK 共用一个内置图标（不依赖上游图标数据）
  const APK_ICON = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">'
    + '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/>'
    + '</linearGradient></defs>'
    + '<rect width="48" height="48" rx="12" fill="url(#g)"/>'
    + '<path d="M24 8v13m-6-6 6 6 6-6" fill="none" stroke="#fff" stroke-width="2.6" '
    + 'stroke-linecap="round" stroke-linejoin="round"/>'
    + '<text x="24" y="37" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" '
    + 'font-size="9" font-weight="700" fill="#fff" letter-spacing="1">APK</text>'
    + '</svg>'
  );

  // GitHub 发布：账号与下载线路可在页面上改
  const GH_DEFAULT_USER = 'shovelshit';
  const GH_CANDIDATES = [
    'https://gh-proxy.com/',
    'https://ghfast.top/',
    'https://ghproxy.net/'
  ];

  const state = {
    mode: 'files',
    booted: false,
    category: CATEGORIES[0],
    path: CATEGORIES[0].path,
    stack: [],
    items: [],
    page: 1,
    query: '',
    counts: {},
    requestId: 0,
    ghUser: localStorage.getItem('gh:user') || GH_DEFAULT_USER,
    ghMode: localStorage.getItem('gh:mode') || 'auto',
    ghCustom: localStorage.getItem('gh:custom') || '',
    ghProxy: '',
    ghProxyOk: null,
    ghLoaded: false,
  };

  const $ = (selector, root = document) => root.querySelector(selector);

  // ===== 工具 =====
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    })[char]);
  }

  function isApkFile(name) { return /\.apk$/i.test(String(name || '')); }
  function isImageFile(name) { return IMAGE_EXT.test(String(name || '')); }

  // 下载/预览都直连上游，不走 Worker 文件代理（相对地址按当前页面解析）
  function directUrl(url) {
    try {
      const target = new URL(url, location.href);
      return /^https?:$/.test(target.protocol) ? target.href : '';
    } catch (error) {
      return '';
    }
  }

  function displayName(name) {
    return String(name || '').replace(/\.apk$/i, '');
  }

  function formatSize(bytes) {
    const value = Number(bytes) || 0;
    if (value <= 0) return '—';
    const units = ['B', 'KB', 'MB', 'GB'];
    let index = 0;
    let size = value;
    while (size >= 1024 && index < units.length - 1) { size /= 1024; index += 1; }
    return `${size.toFixed(index > 0 ? 1 : 0)} ${units[index]}`;
  }

  function formatDate(iso) {
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return '—';
    const pad = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  }

  function kindOf(item) {
    if (item.is_dir) return 'folder';
    if (isApkFile(item.name)) return 'apk';
    if (isImageFile(item.name)) return 'photo';
    return 'other';
  }

  const FALLBACK = { folder: '📁', apk: '📦', photo: '🖼️', other: '📄' };

  function filePath(name) {
    return `${state.path}/${name}`;
  }

  // ===== API =====
  async function requestApi(pathname, params) {
    const options = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params),
    };
    if (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) options.signal = AbortSignal.timeout(10000);
    const response = await fetch(`${API_BASE}${pathname}`, options);
    if (!response.ok) {
      const error = new Error(`HTTP ${response.status}`);
      error.status = response.status;
      throw error;
    }
    return response.json();
  }

  async function fetchList(path) {
    const json = await requestApi('/fs/list', {
      path, password: '', page: 1, per_page: FOLDER_FETCH_SIZE, refresh: false,
    });
    if (json.code !== 200) throw new Error(json.message || '请求失败');
    return Array.isArray(json.data?.content) ? json.data.content : [];
  }

  async function fetchDetail(path) {
    const json = await requestApi('/fs/get', { path });
    if (json.code !== 200) throw new Error(json.message || '请求失败');
    return json.data;
  }

  // ===== 数据 =====
  async function loadPath(category, path, options = {}) {
    const requestId = ++state.requestId;
    setMode('files');
    state.category = category;
    state.path = path;
    state.page = options.page || 1;
    state.query = '';
    $('#searchInput').value = '';
    renderTabs();
    renderCrumb();
    renderSkeleton();

    try {
      const raw = await fetchList(path);
      if (requestId !== state.requestId) return;
      state.items = raw;
      if (path === category.path) {
        state.counts[category.path] = raw.filter((item) => !item.is_dir).length;
      }
      renderTabs();
      renderList();
      renderPager();
      renderSummary();
      preloadCounts();
    } catch (error) {
      if (requestId !== state.requestId) return;
      renderError(error);
    }
  }

  async function preloadCounts() {
    for (const category of CATEGORIES) {
      if (state.counts[category.path] != null) continue;
      try {
        const raw = await fetchList(category.path);
        state.counts[category.path] = raw.filter((item) => !item.is_dir).length;
        renderTabs();
      } catch (error) { /* 计数失败不影响主流程 */ }
    }
  }

  // ===== 渲染 =====
  function renderTabs() {
    const files = state.mode !== 'github';
    const tabs = CATEGORIES.map((category) => {
      const active = files && category.path === state.category.path ? ' active' : '';
      const count = state.counts[category.path];
      return `<button class="tab${active}" type="button" data-category="${escapeHtml(category.path)}" aria-pressed="${active ? 'true' : 'false'}">
        <span aria-hidden="true">${category.icon}</span><span>${escapeHtml(category.name)}</span>
        ${count == null ? '' : `<span class="count">${count}</span>`}
      </button>`;
    });
    tabs.push(`<button class="tab${files ? '' : ' active'}" type="button" data-mode="github" aria-pressed="${files ? 'false' : 'true'}">
      <span aria-hidden="true">🐙</span><span>GitHub 发布</span>
    </button>`);
    $('#tabs').innerHTML = tabs.join('');
  }

  function setMode(mode) {
    state.mode = mode;
    const files = mode !== 'github';
    $('#crumb').hidden = !files;
    $('#summary').hidden = !files;
    $('#list').hidden = !files;
    $('#pager').hidden = !files;
    const panel = $('#ghPanel');
    if (panel) panel.classList.toggle('open', !files);
    if (!files) renderTabs();
  }

  // ===== GitHub releases =====
  const GH_PROBE_TARGET = 'https://github.com/robots.txt';

  function proxyUrl(url) {
    const prefix = String(state.ghProxy || '').trim();
    if (!prefix) return url;
    const base = prefix.endsWith('/') ? prefix : `${prefix}/`;
    return `${base}${url}`;
  }

  // 实际下载地址：加速前缀为空、或探测失败时直连 GitHub
  function deliveryUrl(url) {
    if (!state.ghProxy) return url;
    if (state.ghProxyOk === false) return url;
    return proxyUrl(url);
  }

  async function probeProxy(prefix) {
    const text = String(prefix || '').trim();
    if (!text) return true;
    const base = text.endsWith('/') ? text : `${text}/`;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 6000);
    try {
      // no-cors：只判断网络可达，不读取响应内容
      await fetch(`${base}${GH_PROBE_TARGET}`, {
        mode: 'no-cors',
        cache: 'no-store',
        signal: controller.signal,
      });
      return true;
    } catch (error) {
      return false;
    } finally {
      clearTimeout(timer);
    }
  }

  function renderProxyHint() {
    const hint = $('#ghProxyHint');
    if (!hint) return;
    if (state.ghMode === 'direct') {
      hint.textContent = '直连 GitHub（不使用加速）';
      return;
    }
    if (!state.ghProxy) {
      hint.textContent = state.ghProxyOk === false
        ? '没有可用的加速线路，已自动改为直连'
        : '正在探测可用加速线路…';
      return;
    }
    if (state.ghProxyOk === null) {
      hint.textContent = '正在探测加速线路…';
      return;
    }
    hint.textContent = state.ghProxyOk
      ? `加速线路可用：${state.ghProxy}`
      : '加速线路不可用，已自动改为直连';
  }

  async function refreshProxyState() {
    if (state.ghMode === 'direct') {
      state.ghProxy = '';
      state.ghProxyOk = null;
      renderProxyHint();
      return;
    }

    if (state.ghMode === 'auto') {
      state.ghProxy = '';
      state.ghProxyOk = null;
      renderProxyHint();
      for (const candidate of GH_CANDIDATES) {
        if (await probeProxy(candidate)) {
          state.ghProxy = candidate;
          state.ghProxyOk = true;
          renderProxyHint();
          return;
        }
      }
      state.ghProxyOk = false;
      renderProxyHint();
      return;
    }

    const prefix = state.ghMode === 'custom'
      ? String(state.ghCustom || '').trim()
      : state.ghMode;
    state.ghProxy = prefix;
    if (!prefix) {
      state.ghProxyOk = null;
      renderProxyHint();
      return;
    }
    state.ghProxyOk = null;
    renderProxyHint();
    state.ghProxyOk = await probeProxy(prefix);
    renderProxyHint();
  }

  async function loadGithub(force) {
    const status = $('#ghStatus');
    if (!status) return;
    refreshProxyState();
    status.textContent = `正在扫描 ${state.ghUser} 的公开仓库 releases…`;
    $('#ghList').innerHTML = '';
    try {
      const query = new URLSearchParams({ user: state.ghUser });
      if (force) query.set('refresh', '1');
      const response = await fetch(`/store/api/github/releases?${query.toString()}`);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      state.ghLoaded = true;
      renderGithub(data);
    } catch (error) {
      status.textContent = `加载失败：${error.message}`;
    }
  }

  function renderGithub(data) {
    const status = $('#ghStatus');
    const list = $('#ghList');
    if (!data.repos?.length) {
      status.textContent = `${data.user} 下没有找到带 release 的仓库`;
      list.innerHTML = '';
      return;
    }
    status.textContent = `${data.user} · ${data.repoCount} 个仓库有 release · 更新于 ${formatDate(data.fetchedAt)}`;
    list.innerHTML = data.repos.map((repo) => {
      const releases = repo.releases.map((release) => {
        const assets = release.assets.length
          ? release.assets.map((asset) => `<div class="gh-asset">
              <span class="gh-name" title="${escapeHtml(asset.name)}">${escapeHtml(asset.name)}</span>
              <span class="gh-size">${formatSize(asset.size)}</span>
              <button class="action primary" type="button" data-gh-url="${escapeHtml(asset.url)}">下载</button>
            </div>`).join('')
          : '<div class="gh-status" style="margin:0">该版本没有附件</div>';
        return `<div class="gh-release">
          <div class="gh-tag"><b>${escapeHtml(release.tag)}</b> · ${formatDate(release.publishedAt)}${release.prerelease ? ' · 预发布' : ''}</div>
          ${assets}
        </div>`;
      }).join('');
      return `<div class="gh-repo">
        <div class="gh-repo-head">
          <a href="${escapeHtml(repo.htmlUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(repo.fullName)}</a>
          ${repo.description ? `<span>${escapeHtml(repo.description)}</span>` : ''}
        </div>
        ${releases}
      </div>`;
    }).join('');
  }

  function renderCrumb() {
    const crumb = $('#crumb');
    if (state.path === state.category.path) { crumb.innerHTML = ''; return; }
    const folder = state.path.split('/').filter(Boolean).pop() || '';
    crumb.innerHTML = `
      <button type="button" data-back>← 返回 ${escapeHtml(state.category.name)}</button>
      <span>/</span><span class="current">${escapeHtml(folder)}</span>`;
  }

  function visibleItems() {
    const query = state.query.trim().toLowerCase();
    if (!query) return state.items;
    return state.items.filter((item) => String(item.name).toLowerCase().includes(query));
  }

  function renderSummary() {
    const items = visibleItems();
    const folders = items.filter((item) => item.is_dir).length;
    const files = items.length - folders;
    const apks = items.filter((item) => !item.is_dir && isApkFile(item.name)).length;
    const photos = items.filter((item) => !item.is_dir && isImageFile(item.name)).length;
    const label = state.query.trim() ? `匹配 ${items.length} 项` : `共 ${folders} 个文件夹 · ${files} 个文件`;
    const detail = !state.query.trim() && (apks || photos)
      ? `（${[apks ? `${apks} 个 APK` : '', photos ? `${photos} 张图片` : ''].filter(Boolean).join('，')}）`
      : '';
    $('#summary').innerHTML = `<span><strong>${escapeHtml(state.category.name)}</strong> · ${label}${detail}</span>`;
  }

  function renderSkeleton() {
    $('#list').innerHTML = Array.from({ length: 8 }, () => '<div class="skeleton-row"></div>').join('');
    $('#summary').textContent = '加载中…';
    $('#pager').innerHTML = '';
  }

  function thumbHtml(item, kind) {
    if (kind === 'apk') {
      return `<span class="thumb app"><img src="${APK_ICON}" alt="APK" /></span>`;
    }
    if (kind === 'photo') {
      const thumb = directUrl(item.thumb || '');
      if (thumb) return `<span class="thumb photo"><img src="${escapeHtml(thumb)}" alt="" loading="lazy" /></span>`;
      return `<span class="thumb plain">🖼️</span>`;
    }
    if (kind === 'folder') return '<span class="thumb folder">📁</span>';
    return `<span class="thumb plain">${FALLBACK[kind] || '📄'}</span>`;
  }

  function rowHtml(item) {
    const kind = kindOf(item);
    const path = filePath(item.name);
    const name = kind === 'apk' ? displayName(item.name) : item.name;

    if (kind === 'folder') {
      return `<button class="row" type="button" data-folder="${escapeHtml(item.name)}">
        ${thumbHtml(item, kind)}
        <span class="main">
          <span class="name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span>
          <span class="meta"><span class="tag folder">文件夹</span><span>${formatDate(item.modified)}</span></span>
        </span>
        <span class="row-date"></span>
        <span class="action ghost">进入</span>
      </button>`;
    }

    const action = kind === 'photo'
      ? `<span class="action ghost" data-preview="${escapeHtml(path)}">预览</span>`
      : `<span class="action primary" data-download="${escapeHtml(path)}">下载</span>`;
    const tag = kind === 'apk' ? '<span class="tag">APK</span>'
      : kind === 'photo' ? '<span class="tag photo">图片</span>'
        : `<span class="tag other">${escapeHtml((item.name.split('.').pop() || '文件').toUpperCase())}</span>`;

    return `<button class="row" type="button" data-file="${escapeHtml(path)}">
      ${thumbHtml(item, kind)}
      <span class="main">
        <span class="name" title="${escapeHtml(item.name)}">${escapeHtml(name)}</span>
        <span class="meta">${tag}<span>${formatSize(item.size)}</span><span>${formatDate(item.modified)}</span></span>
      </span>
      <span class="row-date">${kind === 'apk' ? '' : ''}</span>
      ${action}
    </button>`;
  }

  function renderList() {
    const list = $('#list');
    const items = visibleItems();
    const start = (state.page - 1) * PAGE_SIZE;
    const pageItems = items.slice(start, start + PAGE_SIZE);

    if (!state.items.length) {
      list.innerHTML = `<div class="state"><div class="emoji">📭</div><h3>此目录为空</h3><p>换个分类看看</p></div>`;
      return;
    }
    if (!pageItems.length) {
      list.innerHTML = `<div class="state"><div class="emoji">🔍</div><h3>没有匹配项</h3><p>换个关键词试试</p></div>`;
      return;
    }
    list.innerHTML = pageItems.map(rowHtml).join('');
  }

  function renderPager() {
    const total = visibleItems().length;
    const pages = Math.ceil(total / PAGE_SIZE);
    const pager = $('#pager');
    if (pages <= 1) { pager.innerHTML = ''; return; }
    pager.innerHTML = `
      <button type="button" data-page="${state.page - 1}" ${state.page <= 1 ? 'disabled' : ''}>上一页</button>
      <span class="info">第 ${state.page} / ${pages} 页</span>
      <button type="button" data-page="${state.page + 1}" ${state.page >= pages ? 'disabled' : ''}>下一页</button>`;
  }

  function renderError(error) {
    const status = error?.status ? `（HTTP ${error.status}）` : '';
    $('#list').innerHTML = `<div class="state">
      <div class="emoji">⚠️</div><h3>加载失败</h3>
      <p>${escapeHtml(error?.message || '网络异常')}${status}</p>
      <span class="action ghost" data-retry>重试</span>
    </div>`;
    $('#summary').textContent = '加载失败';
    $('#pager').innerHTML = '';
  }

  // ===== 下载 / 预览 =====
  function toast(message) {
    const node = $('#toast');
    node.textContent = message;
    node.classList.add('show');
    clearTimeout(node._timer);
    node._timer = setTimeout(() => node.classList.remove('show'), 2600);
  }

  async function resolveUrl(path) {
    const detail = await fetchDetail(path);
    const url = directUrl(detail.raw_url);
    if (!url) throw new Error('未获取到直链');
    return url;
  }

  function triggerDownload(url) {
    const link = document.createElement('a');
    link.href = url;
    link.rel = 'noopener';
    link.download = '';
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  async function downloadFile(path, button) {
    if (button) {
      button.dataset.label = button.innerHTML;
      button.innerHTML = '<span class="spinner"></span>';
      button.disabled = true;
    }
    try {
      triggerDownload(await resolveUrl(path));
      toast('已开始下载');
    } catch (error) {
      toast(`下载失败：${error.message}`);
    } finally {
      if (button) {
        button.disabled = false;
        if (button.dataset.label) button.innerHTML = button.dataset.label;
      }
    }
  }

  async function openViewer(path, button) {
    const viewer = $('#viewer');
    const image = $('#viewerImg');
    const title = $('#viewerTitle');
    viewer.classList.add('open');
    title.textContent = path.split('/').pop() || '';
    image.removeAttribute('src');
    try {
      const url = await resolveUrl(path);
      image.src = url;
      image.dataset.url = url;
      $('#viewerDownload').onclick = () => { triggerDownload(url); };
      if (button) {
        button.dataset.label = button.innerHTML;
        button.innerHTML = '<span class="spinner" style="border-color:rgba(15,23,42,.2);border-top-color:#0f172a"></span>';
        button.disabled = true;
      }
    } catch (error) {
      toast(`预览失败：${error.message}`);
      closeViewer();
    } finally {
      if (button) {
        button.disabled = false;
        if (button.dataset.label) button.innerHTML = button.dataset.label;
      }
    }
  }

  function closeViewer() {
    const viewer = $('#viewer');
    viewer.classList.remove('open');
    const image = $('#viewerImg');
    image.removeAttribute('src');
    image.dataset.url = '';
  }

  // ===== 事件 =====
  document.addEventListener('click', async (event) => {
    const target = event.target;

    const githubTab = target.closest('[data-mode="github"]');
    if (githubTab) {
      setMode('github');
      if (!state.ghLoaded) await loadGithub();
      return;
    }

    const ghDownload = target.closest('[data-gh-url]');
    if (ghDownload) {
      event.stopPropagation();
      const original = ghDownload.dataset.ghUrl;
      const finalUrl = deliveryUrl(original);
      triggerDownload(finalUrl);
      toast(finalUrl === original ? '已开始下载（直连）' : '已开始下载（加速）');
      return;
    }

    const tab = target.closest('[data-category]');
    if (tab) {
      const category = CATEGORIES.find((item) => item.path === tab.dataset.category);
      if (category) loadPath(category, category.path);
      return;
    }

    const back = target.closest('[data-back]');
    if (back) {
      const previous = state.stack.pop();
      loadPath(state.category, previous || state.category.path);
      return;
    }

    const folder = target.closest('[data-folder]');
    if (folder) {
      state.stack.push(state.path);
      loadPath(state.category, `${state.path.replace(/\/+$/, '')}/${folder.dataset.folder}`);
      return;
    }

    const preview = target.closest('[data-preview]');
    if (preview) {
      event.stopPropagation();
      await openViewer(preview.dataset.preview, preview);
      return;
    }

    const download = target.closest('[data-download]');
    if (download) {
      event.stopPropagation();
      await downloadFile(download.dataset.download, download);
      return;
    }

    const page = target.closest('[data-page]');
    if (page && !page.disabled) {
      state.page = Number(page.dataset.page);
      renderList();
      renderPager();
      renderSummary();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    const retry = target.closest('[data-retry]');
    if (retry) { loadPath(state.category, state.path); return; }

    if (target.closest('[data-close-viewer]')) { closeViewer(); return; }
    if (target.id === 'viewer') { closeViewer(); return; }

    // 点行：文件夹进入；其余按类型处理
    const row = target.closest('[data-file]');
    if (row) {
      const path = row.dataset.file;
      if (isImageFile(path)) await openViewer(path, null);
      else await downloadFile(path, null);
    }
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeViewer();
  });

  $('#searchInput').addEventListener('input', (event) => {
    state.query = event.target.value;
    state.page = 1;
    renderList();
    renderPager();
    renderSummary();
  });

  // ===== 登录门禁 =====
  // 会话由服务端滑动续期：只要一年内打开过一次就不需要重新登录
  async function checkSession() {
    try {
      const response = await fetch('/store/auth/session', { cache: 'no-store' });
      if (response.ok) { showApp(); return; }
    } catch (error) { /* 网络异常时先展示登录门 */ }
    showLogin();
  }

  function showApp() {
    $('#authShell').hidden = true;
    $('#appPage').hidden = false;
    if (state.booted) return; // 已加载过目录时不再重复请求
    state.booted = true;
    renderTabs();
    loadPath(CATEGORIES[0], CATEGORIES[0].path);
  }

  function showLogin() {
    $('#authShell').hidden = false;
    $('#appPage').hidden = true;
    $('#authError').textContent = '';
    $('#authKey').focus();
  }

  $('#authForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = $('#authSubmit');
    const key = $('#authKey').value.trim();
    if (!key) return;
    button.disabled = true;
    button.textContent = '登录中…';
    $('#authError').textContent = '';
    try {
      const response = await fetch('/store/auth/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key })
      });
      if (response.ok) {
        $('#authKey').value = '';
        showApp();
        return;
      }
      const data = await response.json().catch(() => ({}));
      $('#authError').textContent = data.error || `登录失败（HTTP ${response.status}）`;
    } catch (error) {
      $('#authError').textContent = `网络错误：${error.message}`;
    } finally {
      button.disabled = false;
      button.textContent = '登录';
    }
  });

  // ===== 启动 =====
  $('#ghUser').value = state.ghUser;
  $('#ghProxyMode').value = state.ghMode;
  $('#ghProxyCustom').value = state.ghCustom;
  $('#ghCustomWrap').hidden = state.ghMode !== 'custom';
  renderProxyHint();

  $('#ghProxyMode').addEventListener('change', () => {
    state.ghMode = $('#ghProxyMode').value;
    $('#ghCustomWrap').hidden = state.ghMode !== 'custom';
    localStorage.setItem('gh:mode', state.ghMode);
    state.ghProxyOk = null;
    refreshProxyState();
  });

  $('#ghProxyCustom').addEventListener('change', () => {
    state.ghCustom = $('#ghProxyCustom').value.trim();
    localStorage.setItem('gh:custom', state.ghCustom);
    if (state.ghMode === 'custom') {
      state.ghProxyOk = null;
      refreshProxyState();
    }
  });

  $('#ghSave').addEventListener('click', async () => {
    const user = $('#ghUser').value.trim();
    if (!user) { toast('请填写 GitHub 账号'); return; }
    state.ghUser = user;
    state.ghMode = $('#ghProxyMode').value;
    state.ghCustom = $('#ghProxyCustom').value.trim();
    localStorage.setItem('gh:user', state.ghUser);
    localStorage.setItem('gh:mode', state.ghMode);
    localStorage.setItem('gh:custom', state.ghCustom);
    state.ghProxyOk = null;
    state.ghLoaded = false;
    await loadGithub(true);
  });

  renderTabs();
  checkSession();
</script>
</body>
</html>
